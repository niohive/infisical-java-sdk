group=com.niohive
version=1.0.0-SNAPSHOT

org.gradle.configuration-cache=true

# Never download JDKs: they would bypass dependency verification.
org.gradle.java.installations.auto-download=false
# Set by actions/setup-java in CI; unset locally, where Gradle detects installed JDKs.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
