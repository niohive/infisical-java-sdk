name: CI

on:
  pull_request:
  push:
    branches: [monster]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 21 is listed last so it becomes JAVA_HOME and runs Gradle. The others are found as
      # toolchains through org.gradle.java.installations.fromEnv in gradle.properties.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            25
            21

      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build and test on every supported JDK
        run: ./gradlew build testAllJdks
