name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** please don't report them here. Use the repository's Security tab, then "Report a vulnerability".
        **Never paste real secrets, client IDs, client secrets or tokens.**
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "17.0.12 (Temurin)"
    validations:
      required: true
  - type: input
    id: spring
    attributes:
      label: Spring Boot version (if you use the adapter)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exception message or log lines, with any secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
