name: Feature request
description: Suggest a change. This library stays small, so please explain who needs it now.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who needs this today?
      description: Features are added when someone needs them now, not in case someone might later.
    validations:
      required: true
